<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>營運控制台 | AI-SaaS Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="text-slate-800">
  <div class="max-w-3xl mx-auto px-4 py-12">
    
    <div class="flex items-center gap-4 mb-8">
      <div class="w-12 h-12 rounded-2xl bg-indigo-600 flex items-center justify-center text-white">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <div>
        <h1 class="text-3xl font-black text-slate-900 tracking-tight">營運控制台</h1>
        <p class="text-sm font-bold text-slate-500">Admin Dashboard - API Gateway</p>
      </div>
    </div>

    <!-- Server Status -->
    <div id="statusBox" class="p-4 rounded-2xl border flex items-center justify-between mb-8 bg-emerald-50 border-emerald-200">
      <div class="flex items-center gap-3">
        <div id="statusIcon" class="text-emerald-500">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        <div>
          <div id="statusTitle" class="text-sm font-extrabold text-emerald-800">本地後端代理器 (Proxy Server)</div>
          <div id="statusText" class="text-xs text-emerald-600">連線正常</div>
        </div>
      </div>
    </div>

    <!-- Config Form -->
    <div class="p-6 rounded-[28px] bg-white border border-slate-200 shadow-sm">
      <h2 class="text-lg font-black text-slate-900 mb-6 flex items-center gap-2 border-b border-slate-100 pb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-600"><rect width="16" height="16" x="4" y="4" rx="2" ry="2"/><rect width="6" height="6" x="9" y="9" rx="1" ry="1"/><path d="M12 4v1"/><path d="M12 19v1"/><path d="M4 12h1"/><path d="M19 12h1"/></svg>
        AI 模型路由設定
      </h2>

      <div class="space-y-6">
        <!-- Provider Selection -->
        <div class="space-y-2">
          <label class="text-sm font-extrabold text-slate-800">預設驅動引擎 (Provider)</label>
          <div class="grid grid-cols-2 gap-3">
            <button id="btnOpenRouter" onclick="setProvider('openrouter')" class="p-3 rounded-xl border-2 font-bold text-sm transition border-indigo-600 bg-indigo-50 text-indigo-700">OpenRouter</button>
            <button id="btnOpenAI" onclick="setProvider('openai')" class="p-3 rounded-xl border-2 font-bold text-sm transition border-slate-200 text-slate-500 hover:border-indigo-200">OpenAI (官方)</button>
          </div>
        </div>

        <!-- Dynamic Panels -->
        <div id="panelOpenRouter" class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-4">
          <div class="space-y-2">
            <label class="text-xs font-bold text-slate-600">OpenRouter API Key</label>
            <input type="password" id="openrouterKey" placeholder="sk-or-v1-..." class="w-full p-2.5 rounded-xl bg-white border border-slate-300 text-sm font-mono text-slate-800 focus:outline-none focus:border-indigo-500" />
          </div>
          <div class="space-y-2">
            <label class="text-xs font-bold text-slate-600">指定模型 (Model ID)</label>
            <select id="openrouterModel" class="w-full p-2.5 rounded-xl bg-white border border-slate-300 text-sm font-bold text-slate-800 focus:outline-none focus:border-indigo-500">
              <option value="google/gemini-2.5-flash">Google: Gemini 2.5 Flash (快速便宜)</option>
              <option value="google/gemini-2.0-flash-exp:free">Google: Gemini 2.0 Flash Exp (Free)</option>
              <option value="meta-llama/llama-3.3-70b-instruct">Meta: Llama 3.3 70B Instruct</option>
              <option value="anthropic/claude-3-haiku">Anthropic: Claude 3 Haiku</option>
            </select>
          </div>
        </div>

        <div id="panelOpenAI" class="hidden p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-4">
          <div class="space-y-2">
            <label class="text-xs font-bold text-slate-600">OpenAI API Key</label>
            <input type="password" id="openaiKey" placeholder="sk-..." class="w-full p-2.5 rounded-xl bg-white border border-slate-300 text-sm font-mono text-slate-800 focus:outline-none focus:border-indigo-500" />
          </div>
        </div>
      </div>

      <!-- TTS Settings -->
      <h3 class="text-md font-bold text-slate-800 mt-8 mb-4 border-b border-slate-100 pb-2 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-rose-500"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        語音引擎 (ElevenLabs TTS)
      </h3>
      <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-4">
        <div class="space-y-2">
          <label class="text-xs font-bold text-slate-600">ElevenLabs API Key</label>
          <input type="password" id="elevenLabsKey" placeholder="sk_..." class="w-full p-2.5 rounded-xl bg-white border border-slate-300 text-sm font-mono text-slate-800 focus:outline-none focus:border-indigo-500" />
          <p class="text-[10px] text-slate-400">若留空，系統將自動降級使用瀏覽器內建語音 (SpeechSynthesis)。</p>
        </div>
        <div class="space-y-2">
          <label class="text-xs font-bold text-slate-600">Voice ID (預設 Rachel: 21m00Tcm4TlvDq8ikWAM)</label>
          <input type="text" id="elevenLabsVoiceId" placeholder="21m00Tcm4TlvDq8ikWAM" class="w-full p-2.5 rounded-xl bg-white border border-slate-300 text-sm font-mono text-slate-800 focus:outline-none focus:border-indigo-500" />
        </div>
      </div>

      <div class="flex items-center justify-between mt-8">
        <div id="msg" class="text-sm font-bold text-emerald-600"></div>
        <button id="saveBtn" onclick="saveConfig()" class="px-6 py-3 rounded-xl bg-indigo-600 text-white font-black text-sm flex items-center gap-2 hover:bg-indigo-700 transition active:scale-95 shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          儲存設定
        </button>
      </div>
    </div>
  </div>

  <script>
    let currentProvider = 'openrouter';
    let loadedConfig = {};

    function setProvider(p) {
      currentProvider = p;
      if (p === 'openrouter') {
        document.getElementById('btnOpenRouter').className = 'p-3 rounded-xl border-2 font-bold text-sm transition border-indigo-600 bg-indigo-50 text-indigo-700';
        document.getElementById('btnOpenAI').className = 'p-3 rounded-xl border-2 font-bold text-sm transition border-slate-200 text-slate-500 hover:border-indigo-200';
        document.getElementById('panelOpenRouter').classList.remove('hidden');
        document.getElementById('panelOpenAI').classList.add('hidden');
      } else {
        document.getElementById('btnOpenAI').className = 'p-3 rounded-xl border-2 font-bold text-sm transition border-indigo-600 bg-indigo-50 text-indigo-700';
        document.getElementById('btnOpenRouter').className = 'p-3 rounded-xl border-2 font-bold text-sm transition border-slate-200 text-slate-500 hover:border-indigo-200';
        document.getElementById('panelOpenAI').classList.remove('hidden');
        document.getElementById('panelOpenRouter').classList.add('hidden');
      }
    }

    async function loadConfig() {
      try {
        const res = await fetch('/api/admin/config');
        if (res.ok) {
          const data = await res.json();
          loadedConfig = data;
          setProvider(data.provider || 'openrouter');
          
          if (data.openrouterModel) {
            document.getElementById('openrouterModel').value = data.openrouterModel;
          }
          if (data.openrouterKey) {
            document.getElementById('openrouterKey').placeholder = `已設定 (${data.openrouterKey})`;
          }
          if (data.openaiKey) {
            document.getElementById('openaiKey').placeholder = `已設定 (${data.openaiKey})`;
          }
          if (data.elevenLabsKey) {
            document.getElementById('elevenLabsKey').placeholder = `已設定 (${data.elevenLabsKey})`;
          }
          if (data.elevenLabsVoiceId) {
            document.getElementById('elevenLabsVoiceId').value = data.elevenLabsVoiceId;
          }
        }
      } catch (err) {
        console.error('Failed to load config', err);
        document.getElementById('statusBox').className = 'p-4 rounded-2xl border flex items-center justify-between mb-8 bg-red-50 border-red-200';
        document.getElementById('statusIcon').className = 'text-red-500';
        document.getElementById('statusTitle').className = 'text-sm font-extrabold text-red-800';
        document.getElementById('statusText').innerText = '連線失敗，請確認伺服器已啟動';
      }
    }

    async function saveConfig() {
      const btn = document.getElementById('saveBtn');
      const msg = document.getElementById('msg');
      btn.disabled = true;
      btn.innerHTML = '儲存中...';
      msg.innerText = '';
      msg.className = 'text-sm font-bold text-emerald-600';

      const orKey = document.getElementById('openrouterKey').value;
      const oaKey = document.getElementById('openaiKey').value;
      const elKey = document.getElementById('elevenLabsKey').value;
      const elVoice = document.getElementById('elevenLabsVoiceId').value;
      
      const payload = {
        provider: currentProvider,
        openrouterModel: document.getElementById('openrouterModel').value
      };

      if (orKey) payload.openrouterKey = orKey;
      if (oaKey) payload.openaiKey = oaKey;
      if (elKey) payload.elevenLabsKey = elKey;
      if (elVoice) payload.elevenLabsVoiceId = elVoice;

      try {
        const res = await fetch('/api/admin/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          msg.innerText = '✅ 設定儲存成功！';
          document.getElementById('openrouterKey').value = '';
          document.getElementById('openaiKey').value = '';
          document.getElementById('elevenLabsKey').value = '';
          loadConfig(); // Reload placeholders
        } else {
          const err = await res.json();
          msg.className = 'text-sm font-bold text-red-600';
          msg.innerText = `❌ 儲存失敗: ${err.error}`;
        }
      } catch (err) {
        msg.className = 'text-sm font-bold text-red-600';
        msg.innerText = `❌ 無法連線至伺服器`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> 儲存設定`;
      }
    }

    // Init
    loadConfig();
  </script>
</body>
</html>
